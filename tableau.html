<!DOCTYPE html>

<html>

    <head>
        <meta charset="utf-8">
        <title> Tableau </title>
        <link href="tableau.css" rel="stylesheet">

    </head>

    <body>

        <h2>Tableau</h2>

        <table style="width:100%">
        <tr>  <!--la balise (tr) table row crée des lignes-->
            <th>ID</th> <!--la balise (th) table head crée une cellule d'en-tête-->
            <th>NOM</th>
            <th>PRENOM</th>
            <th>DATE DE NAISSANCE</th>
            <th>VILLAGE</th>
        </tr>
        <tr>
            <td>1</td> <!--la balise (td) table data crée une cellule normale-->
            <td>ALI</td>
            <td>SAID</td>
            <td>12/12/2012</td>
            <td>COMBANI</td>
        </tr>
        <tr>
            <td>2</td>
            <td>BACAR</td>
            <td>KOUTSOU</td>
            <td>25/03/1902</td>
            <td>MAMOUDZOU</td>
        </tr>
        <tr>
            <td>3</td>
            <td>MDERE</td>
            <td>ZENA</td>
            <td>13/04/1920</td>
            <td>PAMANDZI</td>
        </tr>
        <tr>
            <td>4</td>
            <td>YOUNOUSSA</td>
            <td>BAMANA</td>
            <td>04/04/1936</td>
            <td>KANI-KELI</td>
        </tr>
        </table>

    </body>

</html>
